name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.11.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri/core -> target
      - run: npm ci
      - name: Check release version
        if: inputs.release
        run: node scripts/check-release-version.mjs
      - run: npm run check

  windows:
    name: Windows build
    needs: tests
    if: inputs.release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.11.2
          install_args: node rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run native:build -- --bundles nsis -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sloy-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux AppImage build
    needs: tests
    if: inputs.release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.11.2
          install_args: node rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run native:build -- --bundles appimage -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sloy-Linux-x64
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  arch-source:
    name: Arch build kit
    needs: tests
    if: inputs.release
    runs-on: ubuntu-24.04
    container: archlinux:base-devel-20261018.0.612668@sha256:a25b54cf4b9c0de8752f5417c81810fb41bbfa5cdd6a504a9b6816a3b86b1e59
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rust nodejs npm webkit2gtk-4.1 gtk3 librsvg openssl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build package as an unprivileged user
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" archive --format=zip --prefix=Sloy-source/ --output=packaging/arch/Sloy-source.zip HEAD
          useradd --create-home builder
          chown -R builder:builder packaging/arch
          runuser -u builder -- bash -c 'cd packaging/arch && makepkg --noconfirm'
          mkdir -p Sloy-Arch
          cp packaging/arch/PKGBUILD packaging/arch/sloy.desktop packaging/arch/Sloy-source.zip Sloy-Arch/
          tar -czf Sloy-Arch-x64.tar.gz Sloy-Arch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sloy-Arch-x64
          path: Sloy-Arch-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android build
    needs: tests
    if: inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.11.2
          install_args: node rust
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-sdk36-ndk28-${{ hashFiles('package-lock.json', 'scripts/prepare-android.mjs') }}
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Configure NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run android:init
      - run: npm run android:release
      - name: Sign release APK
        run: python3 scripts/sign-android.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sloy-Android-arm64
          path: release/*.apk
          if-no-files-found: error
          retention-days: 7

  secrets-scan:
    name: Secrets scan
    if: github.event_name == 'pull_request' && !inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.11.2
          install_args: aqua:betterleaks/betterleaks
      - name: Scan pull request history for secrets
        run: >-
          betterleaks git . --log-opts="--full-history --diff-filter=tuxdb --diff-merges=first-parent
          --format=medium --no-abbrev-commit --no-ext-diff --no-textconv --no-color
          --src-prefix=a/ --dst-prefix=b/
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact

  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [tests, windows, linux, arch-source, android, secrets-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require tests and release builds to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: ${{ inputs.release }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS'])
          required = ['tests']
          if os.environ['RELEASE'].lower() == 'true':
              required += ['windows', 'linux', 'arch-source', 'android']
          elif os.environ['PULL_REQUEST'].lower() == 'true':
              required += ['secrets-scan']
          failed = {name: needs[name]['result'] for name in required if needs[name]['result'] != 'success'}
          if failed:
              raise SystemExit(f'CI failed: {failed}')
          print('Tests and required builds passed.')
          PY
