name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/core -> target
      - run: npm ci
      - name: Check release version
        if: inputs.release
        run: node scripts/check-release-version.mjs
      - run: npm test
      - run: npm run test:native
      - run: npm run test:rust -- --locked
      - run: python3 -m unittest discover -s scripts/tests

  windows:
    name: Windows build
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run native:build -- --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Sloy-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  arch:
    name: Arch build
    needs: tests
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rust nodejs npm webkit2gtk-4.1 gtk3 librsvg openssl
      - uses: actions/checkout@v4
      - name: Prepare source archive
        run: git archive --format=zip --prefix=Sloy-source/ --output=packaging/arch/Sloy-source.zip HEAD
      - name: Build package as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder packaging/arch
          runuser -u builder -- bash -c 'cd packaging/arch && makepkg --noconfirm'
      - uses: actions/upload-artifact@v4
        with:
          name: Sloy-Arch-x64
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android build
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-sdk36-ndk28-${{ hashFiles('package-lock.json', 'scripts/prepare-android.mjs') }}
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Configure NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run android:init
      - if: ${{ !inputs.release }}
        run: npm run android:debug
      - if: ${{ !inputs.release }}
        run: python3 scripts/compact-apk.py
      - if: inputs.release
        run: npm run android:release
      - name: Sign release APK
        if: inputs.release
        run: python3 scripts/sign-android.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release && 'Sloy-Android-arm64' || 'Sloy-Android-arm64-preview' }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 7

  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [tests, windows, arch, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all tests and builds to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if len(results) != 4 or any(result != 'success' for result in results):
              raise SystemExit(f'CI failed: {results}')
          print('All tests and platform builds passed.')
          PY
