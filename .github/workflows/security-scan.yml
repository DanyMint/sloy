name: Security scans

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secrets and dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.2
      - name: Scan repository history for secrets
        run: betterleaks git . --log-opts="--full-history --all --diff-filter=tuxdb --diff-merges=first-parent" --redact
      - name: Scan lockfiles for known vulnerabilities
        run: >-
          osv-scanner scan source
          --lockfile=package-lock.json
          --lockfile=src-tauri/Cargo.lock
          --lockfile=src-tauri/core/Cargo.lock
