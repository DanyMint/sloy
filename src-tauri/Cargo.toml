[package]
name = "sloy"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Sloy — Obsidian planner"
[lib]
name = "sloy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-android-fs = "30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sloy-core = { path = "core" }
sha2 = "0.10"
